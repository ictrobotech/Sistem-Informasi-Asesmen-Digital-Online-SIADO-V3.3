  bersihkanPapanKlip_();
}

function sembunyikanPerisaiLayar_() {
  var shield = document.getElementById('screenshotShield');
  if (!shield) return;
  shield.classList.remove('show');
  shield.setAttribute('aria-hidden', 'true');
}

/** Isi papan klip ditimpa agar hasil salin/tangkap tidak dapat dipakai. */
function bersihkanPapanKlip_() {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(' ').catch(function() {});
    }
  } catch (error) {}
}

/** Pemberitahuan singkat tanpa menambah hitungan pelanggaran. */
function peringatanRingan_(pesan) {
  if (GUARD.toastRinganTimer) return;
  GUARD.toastRinganTimer = window.setTimeout(function() { GUARD.toastRinganTimer = null; }, 2500);
  tampilkanToastPeserta_(pesan, true);
}

/* ------------- KELUAR APLIKASI / BROWSER (DICATAT ULANG) ------------- */
function tandaiKeluarPaksa_(detail) {
  if (!UJIAN.aktif || !UJIAN.peserta) return;
  try {
    sessionStorage.setItem(GUARD.KEY_KELUAR_PAKSA, JSON.stringify({
      sessionId: UJIAN.peserta.sessionId,
      detail: detail || 'Keluar dari aplikasi/browser saat ujian berlangsung.',
      waktu: Date.now()
    }));
  } catch (error) {}
}

function bersihkanPenandaKeluarPaksa_() {
  try { sessionStorage.removeItem(GUARD.KEY_KELUAR_PAKSA); } catch (error) {}
}

/**
 * Menutup browser saat ujian tidak dapat dikirim langsung ke server (halaman
 * sudah mati). Penandanya disimpan lokal, lalu dilaporkan begitu peserta
 * membuka kembali ujian pada sesi yang sama.
 */
function laporKeluarPaksaTertunda_() {
  var raw = null;
  try { raw = sessionStorage.getItem(GUARD.KEY_KELUAR_PAKSA); } catch (error) { return; }
  if (!raw) return;
  bersihkanPenandaKeluarPaksa_();
  var data = null;
  try { data = JSON.parse(raw); } catch (error) { return; }
  if (!data || !UJIAN.peserta) return;
  if (String(data.sessionId) !== String(UJIAN.peserta.sessionId)) return;
  window.setTimeout(function() {
    if (!UJIAN.aktif) return;
    reportViolation('keluar_aplikasi', data.detail || 'Aplikasi/browser ditutup saat ujian berlangsung.');
  }, 1200);
}

/** Tombol kembali (back) browser & tombol back Android dilumpuhkan. */
function pasangPerangkapTombolKembali_() {
  if (GUARD.historyDipasang) return;
  try {
    window.history.pushState({ siadoGuard: Date.now() }, document.title, window.location.href);
  } catch (error) { return; }
  GUARD.historyDipasang = true;
  window.addEventListener('popstate', tanganiTombolKembali_);
}

function tanganiTombolKembali_() {
  if (!UJIAN.aktif) return;
  try {
    window.history.pushState({ siadoGuard: Date.now() }, document.title, window.location.href);
  } catch (error) {}
  GUARD.jumlahTombolKembali += 1;
  if (GUARD.jumlahTombolKembali === 1) {
    peringatanRingan_('Tombol kembali dinonaktifkan selama ujian. Percobaan berikutnya dicatat sebagai pelanggaran.');
    return;
  }
  reportViolation('tombol_kembali', 'Menekan tombol kembali/back browser saat ujian berlangsung.');
}

/** Permintaan berbagi/merekam layar ditolak selama ujian aktif. */
function pasangBlokirRekamLayar_() {
  if (GUARD.displayMediaDibungkus) return;
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) return;
    var asli = navigator.mediaDevices.getDisplayMedia.bind(navigator.mediaDevices);
    navigator.mediaDevices.getDisplayMedia = function() {
      if (UJIAN.aktif) {
        aktifkanPerisaiLayar_('Perekaman / berbagi layar diblokir.');
        reportViolation('rekam_layar', 'Percobaan merekam atau membagikan layar saat ujian.');
        return Promise.reject(new Error('Perekaman layar diblokir selama ujian.'));
      }
      return asli.apply(navigator.mediaDevices, arguments);
    };
    GUARD.displayMediaDibungkus = true;
  } catch (error) {}
}

/* ======================== PEMASANGAN EVENT ======================== */
function bindSecurityEvents() {
  document.addEventListener('visibilitychange', function() {
    if (!UJIAN.aktif) return;
    if (document.hidden) {
      // Soal langsung disamarkan agar tidak terbaca pada pratinjau pengalih
      // aplikasi (task switcher), rekaman layar, atau jendela berdampingan.
      samarkanKontenUjian_(true);
      // Pada mobile, layar HP mati (tombol power / auto-lock) diberi masa
      // tenggang; bila layar hidup kembali sebelum batas, TIDAK dihitung
      // pelanggaran. Pindah tab yang benar-benar meninggalkan aplikasi tetap
      // dihitung setelah masa tenggang berlalu.
      catatKeluarTampilanSoal_(isMobileDevice() ?
        'Peserta meninggalkan tampilan soal pada perangkat mobile.' :
        'Halaman ujian tidak lagi terlihat pada perangkat desktop.');
    } else {
      // Perhitungan absen mobile diselesaikan di sini (bukan oleh timer latar
      // belakang yang dibekukan browser HP).
      selesaikanAbsenMobile_();
      samarkanKontenUjian_(false);
      UJIAN.tabKeluarAktif = false;
      // Browser mobile menunda request saat aplikasi di background; kirim ulang
      // event yang belum mendapat respons (eventId mencegah hitung ganda).
      window.setTimeout(retryPendingViolationEvents_, 300);
      // Layar penuh dipulihkan; bila browser menolak, gerbang layar penuh
      // muncul dan peserta wajib menekan tombolnya.
      if (UJIAN.fullscreenRestorePending || !sedangLayarPenuh_()) requestFullscreenSafe();
    }
  });

  window.addEventListener('blur', function() {
    if (!UJIAN.aktif) return;
    samarkanKontenUjian_(true);
    if (isMobileDevice()) return;
    window.setTimeout(function() {
      if (UJIAN.aktif && !document.hasFocus()) {
        catatKeluarTampilanSoal_('Fokus berpindah dari halaman ujian.');
      }
    }, 350);
  });

  window.addEventListener('focus', function() {
    if (!UJIAN.aktif) return;
    samarkanKontenUjian_(false);
    if (document.visibilityState === 'visible') UJIAN.tabKeluarAktif = false;
  });

  // Halaman ditinggalkan/ditutup: penanda disimpan agar pelanggaran tetap
  // tercatat ketika peserta membuka ujian kembali.
  window.addEventListener('pagehide', function() {
    if (!UJIAN.aktif || GUARD.navigasiResmi) return;
    samarkanKontenUjian_(true);
    tandaiKeluarPaksa_('Halaman ujian ditutup atau ditinggalkan (pagehide).');
  });

  // Konfirmasi bawaan browser saat peserta menutup tab/jendela atau menekan
  // tombol muat ulang. Dialog ini satu-satunya cara sah menahan penutupan.
  window.addEventListener('beforeunload', function(event) {
    if (!UJIAN.aktif || GUARD.navigasiResmi || UJIAN.selesaiDiproses) return;
    tandaiKeluarPaksa_('Percobaan menutup / meninggalkan halaman ujian.');
    var pesan = 'Ujian masih berlangsung. Keluar sekarang dicatat sebagai pelanggaran.';
    event.preventDefault();
    event.returnValue = pesan;
    return pesan;
  });

  window.addEventListener('resize', function() {
    if (!UJIAN.aktif) return;
    clearTimeout(splitTimer);
    // Mobile diberi jeda lebih panjang agar papan ketik/bilah alamat stabil dulu.
    splitTimer = setTimeout(checkSplitScreen, isMobileDevice() ? 1500 : 900);
  });

  // Android mengubah visualViewport saat masuk mode layar terbagi.
  if (window.visualViewport && window.visualViewport.addEventListener) {
    window.visualViewport.addEventListener('resize', function() {
      if (!UJIAN.aktif || !isMobileDevice()) return;
      clearTimeout(splitTimer);
      splitTimer = setTimeout(checkSplitScreen, 1500);
    });
  }

  window.addEventListener('orientationchange', function() {
    if (UJIAN.aktif && isMobileDevice() && window.matchMedia('(orientation: landscape)').matches) {
      // CSS orientation lock menutup konten ujian. Tidak membuat JEDA dan tidak menambah pelanggaran.
      console.warn('Mode landscape diblokir; putar perangkat ke portrait.');
    }
  });

  var fullscreenChangeHandler = function() {
    if (sedangLayarPenuh_()) {
      UJIAN.fullscreenActivated = true;
      UJIAN.fullscreenRestorePending = false;
      sembunyikanGerbangLayarPenuh_();
      return;
    }
    if (!UJIAN.aktif) return;
    // Keluar dari layar penuh saat ujian: soal ditutup gerbang sampai peserta
    // kembali ke layar penuh lewat tombol (gesture wajib menurut browser).
    if (bolehTampilGerbang_()) tampilkanGerbangLayarPenuh_();
    if (UJIAN.fullscreenActivated && !document.hidden && !UJIAN.tabKeluarAktif &&
        !UJIAN.fullscreenRestorePending) {
      reportViolation('keluar_fullscreen', 'Keluar dari mode layar penuh.');
    }
  };
  document.addEventListener('fullscreenchange', fullscreenChangeHandler);
  document.addEventListener('webkitfullscreenchange', fullscreenChangeHandler);

  // Setiap sentuhan/klik peserta dipakai sebagai gesture untuk memulihkan
  // layar penuh yang tertinggal (dibatasi 1 permintaan per 1,5 detik).
  ['pointerdown', 'touchend'].forEach(function(namaEvent) {
    document.addEventListener(namaEvent, function() {
      if (!UJIAN.aktif || UJIAN.jeda || UJIAN.selesaiDiproses) return;
      if (sedangLayarPenuh_() || !fullscreenDidukung_()) return;
      // Jeda 5 detik: setiap permintaan layar penuh memunculkan notifikasi
      // bawaan browser, jadi jangan sampai bertubi-tubi.
      if (Date.now() - GUARD.fsPercobaanTerakhir < 5000) return;
      GUARD.fsPercobaanTerakhir = Date.now();
      requestFullscreenSafe(true);
    }, true);
  });

  document.addEventListener('keydown', function(event) {
    if (!UJIAN.aktif) return;
    var key = String(event.key || '').toLowerCase();
    var ctrl = !!(event.ctrlKey || event.metaKey);
    var sedangMengetik = isTextEditing();

    /* 1) TANGKAPAN LAYAR & CETAK ------------------------------------- */
    var printScreen = event.key === 'PrintScreen' || key === 'printscreen' || event.keyCode === 44;
    var snipWindows = event.shiftKey && (event.metaKey || event.getModifierState && event.getModifierState('Meta')) && key === 's';
    var snipMac = event.metaKey && event.shiftKey && ['3', '4', '5'].indexOf(key) !== -1;
    var cetakHalaman = ctrl && key === 'p';
    if (printScreen || snipWindows || snipMac || cetakHalaman) {
      event.preventDefault();
      event.stopPropagation();
      aktifkanPerisaiLayar_(cetakHalaman ?
        'Mencetak halaman ujian diblokir.' : 'Tangkapan layar diblokir.');
      reportViolation('screenshot', cetakHalaman ?
        'Percobaan mencetak halaman ujian.' : 'Shortcut tangkapan layar terdeteksi.');
      return;
    }

    /* 2) ALAT PENGEMBANG & SIMPAN HALAMAN ---------------------------- */
    if (event.key === 'F12' || (ctrl && event.shiftKey && ['i', 'j', 'c', 'k'].indexOf(key) !== -1) ||
        (ctrl && key === 'u')) {
      event.preventDefault();
      event.stopPropagation();
      peringatanRingan_('Alat pengembang dinonaktifkan selama ujian.');
      reportViolation('devtools', 'Percobaan membuka alat pengembang / kode sumber halaman.');
      return;
    }
    if (ctrl && key === 's' && !sedangMengetik) {
      event.preventDefault();
      event.stopPropagation();
      peringatanRingan_('Menyimpan halaman ujian tidak diizinkan.');
      return;
    }

    /* 3) TAB / JENDELA BARU, PINDAH TAB, DAN BARIS ALAMAT ------------ */
    var tabJendelaBaru = ctrl && ['t', 'n', 'w', 'q'].indexOf(key) !== -1;
    var pintasanPindahTab = (ctrl && (key === 'tab' || key === 'pageup' || key === 'pagedown')) ||
      (ctrl && !event.shiftKey && /^[1-9]$/.test(key)) ||
      (event.altKey && /^[1-9]$/.test(key));
    var barisAlamat = (ctrl && ['l', 'o', 'e', 'h', 'd'].indexOf(key) !== -1) ||
      (event.altKey && key === 'd') || event.key === 'F6' || event.key === 'F3';
    var navigasiSejarah = (event.altKey && (key === 'arrowleft' || key === 'arrowright')) ||
      (key === 'backspace' && !sedangMengetik);
    if (tabJendelaBaru || pintasanPindahTab || barisAlamat || navigasiSejarah) {
      event.preventDefault();
      event.stopPropagation();
      peringatanRingan_('Berpindah tab / jendela diblokir selama ujian berlangsung.');
      return;
    }

    /* 4) MUAT ULANG: dialihkan ke tombol Refresh internal -------------- */
    if (event.key === 'F5' || (ctrl && key === 'r')) {
      event.preventDefault();
      event.stopPropagation();
      peringatanRingan_('Gunakan tombol Refresh di dalam aplikasi agar jawaban tidak hilang.');
      refreshHalamanUjian();
      return;
    }

    /* 5) LAYAR PENUH --------------------------------------------------- */
    if (event.key === 'F11') {
      event.preventDefault();
      event.stopPropagation();
      requestFullscreenSafe(true);
      return;
    }
    if (key === 'escape' && sedangLayarPenuh_()) {
      // Esc tidak dapat dibatalkan browser. Kejadiannya tetap dicatat oleh
      // fullscreenchange; di sini hanya gerbang layar penuh yang disiapkan.
      window.setTimeout(function() {
        if (UJIAN.aktif && !sedangLayarPenuh_() && bolehTampilGerbang_()) tampilkanGerbangLayarPenuh_();
      }, 250);
    }

    /* 6) PAPAN KLIK (kecuali kolom jawaban uraian) --------------------- */
    if (ctrl && key === 'a' && !sedangMengetik && !clipboardAllowedForEssay(document.activeElement)) {
      event.preventDefault();
      return;
    }
    if (ctrl && ['c', 'x', 'v'].indexOf(key) !== -1 && !clipboardAllowedForEssay(document.activeElement)) {
      event.preventDefault();
      reportViolation(key === 'v' ? 'paste_non_uraian' : (key === 'x' ? 'cut_soal' : 'copy_soal'),
        'Shortcut clipboard pada tampilan soal.');
    }
  }, true);

  // Sebagian browser hanya mengirim PrintScreen pada keyup.
  document.addEventListener('keyup', function(event) {
    if (!UJIAN.aktif) return;
    if (event.key === 'PrintScreen' || String(event.key || '').toLowerCase() === 'printscreen' || event.keyCode === 44) {
      event.preventDefault();
      aktifkanPerisaiLayar_('Tangkapan layar diblokir.');
      reportViolation('screenshot', 'Tombol PrintScreen terdeteksi (keyup).');
    }
  }, true);

  // Cetak lewat menu browser: konten disembunyikan oleh CSS @media print,
  // kejadiannya tetap dicatat sebagai pelanggaran.
  if (window.matchMedia) {
    try {
      var mediaCetak = window.matchMedia('print');
      var handlerCetak = function(mq) {
        if (!UJIAN.aktif || !mq.matches) return;
        aktifkanPerisaiLayar_('Mencetak halaman ujian diblokir.');
        reportViolation('screenshot', 'Percobaan mencetak halaman ujian dari menu browser.');
      };
      if (mediaCetak.addEventListener) mediaCetak.addEventListener('change', handlerCetak);
      else if (mediaCetak.addListener) mediaCetak.addListener(handlerCetak);
    } catch (error) {}
  }
  window.addEventListener('beforeprint', function() {
    if (!UJIAN.aktif) return;
    aktifkanPerisaiLayar_('Mencetak halaman ujian diblokir.');
    reportViolation('screenshot', 'Percobaan mencetak halaman ujian (beforeprint).');
  });

  document.addEventListener('copy', function(event) {
    if (!UJIAN.aktif || clipboardAllowedForEssay(event.target)) return;
    event.preventDefault();
    reportViolation('copy_soal', 'Upaya menyalin teks pada halaman ujian.');
  }, true);
  document.addEventListener('cut', function(event) {
    if (!UJIAN.aktif || clipboardAllowedForEssay(event.target)) return;
    event.preventDefault();
    reportViolation('cut_soal', 'Upaya memotong teks pada halaman ujian.');
  }, true);
  document.addEventListener('paste', function(event) {
    if (!UJIAN.aktif || clipboardAllowedForEssay(event.target)) return;
    event.preventDefault();
    reportViolation('paste_non_uraian', 'Upaya menempel jawaban selain pada soal uraian.');
  }, true);
  document.addEventListener('contextmenu', function(event) {
    if (UJIAN.aktif) event.preventDefault();
  }, true);
  document.addEventListener('dragstart', function(event) {
    if (UJIAN.aktif) event.preventDefault();
  }, true);
  document.addEventListener('selectstart', function(event) {
    if (!UJIAN.aktif) return;
    var target = event.target;
    var tag = target && target.tagName ? String(target.tagName).toUpperCase() : '';
    // Kolom jawaban peserta tetap dapat diseleksi seperti biasa.
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (target && target.isContentEditable)) return;
    if (clipboardAllowedForEssay(target) || isTextEditing()) return;
    event.preventDefault();
  }, true);

  window.addEventListener('offline', function() {
    if (UJIAN.aktif) pauseForRecovery('Koneksi internet terputus. Tampilan dijeda; waktu resmi tetap berjalan.');
  });
  window.addEventListener('error', function(event) {
    // Error antarmuka tidak otomatis menghentikan timer. JEDA dikhususkan untuk jaringan/server.
    if (UJIAN.aktif && event && event.message) console.warn('Error antarmuka ujian:', event.message);
  });
  window.addEventListener('unhandledrejection', function() {
    // Hanya jadikan JEDA bila browser benar-benar mendeteksi kondisi offline.
    if (UJIAN.aktif && !UJIAN.jeda && navigator.onLine === false) {
      pauseForRecovery('Jaringan internet terputus. Tampilan dijeda; waktu resmi tetap berjalan.');
    }
  });
}

function catatKeluarTampilanSoal_(detail) {
  // blur dan visibilitychange biasanya muncul bersamaan untuk satu perpindahan tab.
  // Flag ini memastikan satu kali keluar = satu peringatan, lalu reset saat peserta kembali.
  if (!UJIAN.aktif || UJIAN.jeda || UJIAN.tabKeluarAktif) return;

  // REVISI KEAMANAN: pada perangkat mobile, layar HP mati (tombol power,
  // auto-lock, notifikasi) BUKAN pelanggaran. Diberi masa tenggang singkat;
  // hanya bila layar masih mati melewati batas (benar-benar meninggalkan
  // aplikasi) pelanggaran pindah tab dicatat.
  if (isMobileDevice()) {
    antreCekLayarMati_(detail);
    return;
  }

  UJIAN.tabKeluarAktif = true;
  UJIAN.fullscreenRestorePending = true;
  UJIAN.urutanKeluarTab += 1;

  // Tampilkan hitungan segera; respons server berikutnya menjadi sumber kebenaran.
  UJIAN.pelanggaranPindahTab = Math.min(3, Number(UJIAN.pelanggaranPindahTab || 0) + 1);
  document.getElementById('violationCount').textContent = UJIAN.pelanggaranPindahTab;

  var eventId = 'tab-' + UJIAN.urutanKeluarTab + '-' + Date.now();
  reportViolation('pindah_tab', detail, eventId);
}

/* ============================================================
 * ABSEN PERANGKAT MOBILE: LAYAR MATI vs PINDAH APLIKASI
 *
 * PERBAIKAN PENTING (REVISI 3.5). Versi sebelumnya menentukan pelanggaran
 * memakai setTimeout selama masa tenggang. Padahal Android dan iOS
 * MEMBEKUKAN timer begitu aplikasi berada di latar belakang, sehingga timer
 * baru berjalan ketika peserta sudah kembali — saat itu document.hidden
 * sudah false dan pelanggaran TIDAK PERNAH tercatat. Akibatnya blokir pindah
 * tab praktis tidak berfungsi di HP.
 *
 * Sekarang lama absen dihitung dari selisih waktu nyata (Date.now) pada saat
 * peserta kembali, sehingga tidak bergantung pada timer latar belakang.
 * ============================================================ */
function graceLayarMatiMs_() {
  return Math.max(2, Math.min(30, Number(UJIAN.layarMatiGrace || 5))) * 1000;
}

function antreCekLayarMati_(detail) {
  if (!UJIAN.aktif || UJIAN.jeda || GUARD.absenAktif) return;
  UJIAN.fullscreenRestorePending = true;
  UJIAN.urutanKeluarTab += 1;
  GUARD.absenAktif = {
    mulai: Date.now(),
    detail: detail || 'Peserta meninggalkan tampilan soal pada perangkat mobile.',
    // eventId dikunci sejak awal absen supaya pencatatan lewat timer maupun
    // lewat kepulangan peserta tidak pernah dihitung dua kali oleh server.
    eventId: 'tab-' + UJIAN.urutanKeluarTab + '-' + Date.now(),
    dicatat: false
  };
  // Timer hanya bonus untuk perangkat yang masih menjalankannya di latar belakang.
  UJIAN.layarMatiTimer = window.setTimeout(function() {
    UJIAN.layarMatiTimer = null;
    if (!UJIAN.aktif || UJIAN.jeda || !document.hidden || !GUARD.absenAktif) return;
    catatAbsenMobile_(Math.round((Date.now() - GUARD.absenAktif.mulai) / 1000));
  }, graceLayarMatiMs_());
}

/** Mencatat satu absen mobile sebagai pelanggaran pindah tab (idempoten). */
function catatAbsenMobile_(durasiDetik) {
  var absen = GUARD.absenAktif;
  if (!absen || absen.dicatat) return;
  absen.dicatat = true;
  UJIAN.tabKeluarAktif = true;
  UJIAN.pelanggaranPindahTab = Math.min(3, Number(UJIAN.pelanggaranPindahTab || 0) + 1);
  document.getElementById('violationCount').textContent = UJIAN.pelanggaranPindahTab;
  reportViolation('pindah_tab',
    absen.detail + ' Meninggalkan aplikasi sekitar ' + Math.max(1, Number(durasiDetik || 0)) + ' detik.',
    absen.eventId);
}

/** Dipanggil ketika tampilan soal terlihat kembali pada perangkat mobile. */
function selesaikanAbsenMobile_() {
  if (UJIAN.layarMatiTimer) {
    clearTimeout(UJIAN.layarMatiTimer);
    UJIAN.layarMatiTimer = null;
  }
  var absen = GUARD.absenAktif;
  if (!absen) return;
  var durasiDetik = Math.round((Date.now() - absen.mulai) / 1000);
  if (!absen.dicatat && (durasiDetik * 1000) >= graceLayarMatiMs_()) {
    catatAbsenMobile_(durasiDetik);       // benar-benar meninggalkan aplikasi
    GUARD.absenAktif = null;
    return;
  }
  GUARD.absenAktif = null;
  if (!absen.dicatat) akumulasiAbsenSingkat_(durasiDetik);
}

/**
 * Absen singkat (layar mati sekejap, notifikasi masuk) tetap dimaafkan, tetapi
 * diakumulasi. Bila terjadi berulang kali dalam 3 menit, peserta jelas sedang
 * bolak-balik meninggalkan aplikasi sehingga dicatat sebagai pelanggaran.
 */
function akumulasiAbsenSingkat_(durasiDetik) {
  var sekarang = Date.now();
  GUARD.absenSingkat = GUARD.absenSingkat.filter(function(waktu) { return sekarang - waktu < 180000; });
  GUARD.absenSingkat.push(sekarang);
  var maks = Math.max(2, Math.min(10, Number(UJIAN.maksAbsenSingkat || 3)));
  var sisa = maks - GUARD.absenSingkat.length;
  if (sisa > 0) {
    peringatanRingan_('Anda meninggalkan tampilan soal ' + Math.max(1, durasiDetik) + ' detik. ' +
      'Jangan berpindah aplikasi — ' + sisa + ' kali lagi akan dicatat sebagai pelanggaran.');
    return;
  }
  GUARD.absenSingkat = [];
  UJIAN.urutanKeluarTab += 1;
  UJIAN.tabKeluarAktif = true;
  UJIAN.pelanggaranPindahTab = Math.min(3, Number(UJIAN.pelanggaranPindahTab || 0) + 1);
  document.getElementById('violationCount').textContent = UJIAN.pelanggaranPindahTab;
  reportViolation('pindah_tab',
    'Berulang kali meninggalkan tampilan soal dalam waktu singkat (' + maks + ' kali dalam 3 menit).',
    'tab-' + UJIAN.urutanKeluarTab + '-' + Date.now());
}

/** Membatalkan pemantauan absen (dipakai saat ujian berakhir). */
function batalTenggangLayarMati_() {
  if (UJIAN.layarMatiTimer) {
    clearTimeout(UJIAN.layarMatiTimer);
    UJIAN.layarMatiTimer = null;
  }
  if (GUARD.splitUlangTimer) {
    clearTimeout(GUARD.splitUlangTimer);
    GUARD.splitUlangTimer = null;
  }
  GUARD.absenAktif = null;
  GUARD.splitBerturut = 0;
}

function checkSplitScreen() {
  if (!UJIAN.aktif || UJIAN.jeda || document.hidden || isTextEditing()) return;
  var screenWidth = Math.max(window.screen.width || 0, window.screen.availWidth || 0);
  var screenHeight = Math.max(window.screen.height || 0, window.screen.availHeight || 0);
  if (!screenWidth || !screenHeight) return;
  if (isMobileDevice()) {
    periksaSplitMobile_(screenWidth, screenHeight);
    return;
  }
  var narrow = window.innerWidth / screenWidth < 0.72;
  var short = window.innerHeight / screenHeight < 0.67;
  if (narrow || short) reportViolation('split_screen', 'Ukuran jendela mengindikasikan split screen atau jendela diperkecil.');
}

/**
 * Split screen / jendela mengambang pada Android (REVISI 3.5).
 *
 * Sebelumnya perangkat mobile dilewati sama sekali, padahal mode layar terbagi
 * adalah celah menyontek paling mudah di HP. Ambangnya sengaja longgar dan
 * harus bertahan dua kali pemeriksaan supaya papan ketik virtual, bilah alamat
 * yang muncul-hilang, dan perangkat lipat tidak salah dihukum.
 */
function periksaSplitMobile_(lebarLayar, tinggiLayar) {
  var vv = window.visualViewport;
  // Papan ketik virtual sedang terbuka: tinggi visual jauh di bawah tinggi layout.
  if (vv && vv.height && window.innerHeight && (vv.height / window.innerHeight) < 0.75) return;
  var rasioLebar = window.innerWidth / lebarLayar;
  var rasioTinggi = window.innerHeight / tinggiLayar;
  if (rasioLebar >= 0.72 && rasioTinggi >= 0.55) {
    GUARD.splitBerturut = 0;
    return;
  }
  GUARD.splitBerturut += 1;
  if (GUARD.splitBerturut < 2) {
    // Pastikan sekali lagi setelah tampilan stabil sebelum menghukum.
    if (GUARD.splitUlangTimer) clearTimeout(GUARD.splitUlangTimer);
    GUARD.splitUlangTimer = window.setTimeout(function() {
      GUARD.splitUlangTimer = null;
      checkSplitScreen();
    }, 1500);
    return;
  }
  GUARD.splitBerturut = 0;
  peringatanRingan_('Mode layar terbagi terdeteksi. Gunakan satu aplikasi penuh untuk ujian.');
  reportViolation('split_screen', 'Layar terbagi (split screen) atau jendela mengambang terdeteksi pada perangkat mobile.');
}

function retryPendingViolationEvents_() {
  if (!UJIAN.aktif || UJIAN.jeda || document.hidden) return;
  Object.keys(UJIAN.pendingViolationEvents).forEach(function(eventId) {
    var item = UJIAN.pendingViolationEvents[eventId];
    if (item && !item.retrying) {
      item.retrying = true;
      setTimeout(function() {
        item.retrying = false;
        if (UJIAN.pendingViolationEvents[eventId]) {
          reportViolation(item.jenis, item.detail, eventId, true);
        }
      }, 150);
    }
  });
}

function enqueueViolationWarning_(message) {
  UJIAN.warningQueue.push(String(message || 'Pelanggaran keamanan terdeteksi.'));
  showNextViolationWarning_();
}

function showNextViolationWarning_() {
  if (UJIAN.warningVisible || !UJIAN.warningQueue.length || !UJIAN.aktif) return;
  UJIAN.warningVisible = true;
  // Gerbang layar penuh disingkirkan agar tombol "Saya Mengerti" bisa ditekan;
  // tombol itulah yang mengembalikan layar penuh dengan gesture sah.
  sembunyikanGerbangLayarPenuh_();
  // REVISI 3.4b: perisai tangkapan layar juga ditutup, kalau tidak notifikasi
  // peringatan tertutup layar hitam dan peserta tidak melihat apa pun.
  window.clearTimeout(GUARD.shieldTimer);
  sembunyikanPerisaiLayar_();
  samarkanKontenUjian_(false);
  document.getElementById('warningText').textContent = UJIAN.warningQueue.shift();
  showModal('warningModal');
  // Best-effort: layar penuh diminta kembali saat peringatan ditampilkan.
  // Jika browser menolak (butuh gesture), tombol "Saya Mengerti" yang
  // memastikan fullscreen dipulihkan.
  requestFullscreenSafe();
}

function reportViolation(jenis, detail, eventId, isRetry) {
  if (!UJIAN.aktif || UJIAN.jeda) return;
  if (jenis === 'pindah_tab' && eventId && !UJIAN.pendingViolationEvents[eventId]) {
    UJIAN.pendingViolationEvents[eventId] = { jenis: jenis, detail: detail, retrying: false };
  }
  // Cooldown hanya untuk event non-tab. Perpindahan tab memakai eventId unik
  // sehingga setiap siklus keluar → kembali dapat langsung diberi peringatan.
  if (jenis !== 'pindah_tab' && UJIAN.cooldown[jenis]) return;
  if (jenis !== 'pindah_tab') {
    UJIAN.cooldown[jenis] = true;
    setTimeout(function() { delete UJIAN.cooldown[jenis]; }, 4200);
  }
  // Peringatan lokal disiapkan lebih dulu; dibatalkan begitu server membalas
  // dengan pesan resminya sehingga peserta tidak menerima dua notifikasi.
  jadwalkanPeringatanCadangan_(jenis);

  apiPeserta('catatPelanggaran', Object.assign(credentialSesi(), {
    jenis: jenis,
    detail: detail,
    eventId: eventId || ''
  })).then(function(result) {
    batalkanPeringatanCadangan_(jenis);
    if (!result.success) {
      handleExamErrorResult(result);
      return;
    }
    if (typeof result.jumlahPelanggaran === 'number') UJIAN.pelanggaran = result.jumlahPelanggaran;
    if (typeof result.jumlahPindahTab === 'number') {
      UJIAN.pelanggaranPindahTab = Math.max(UJIAN.pelanggaranPindahTab, result.jumlahPindahTab);
    }
    document.getElementById('violationCount').textContent = Math.min(3, UJIAN.pelanggaranPindahTab);
    if (eventId) {
      delete UJIAN.pendingViolationEvents[eventId];
      if (UJIAN.processedViolationEvents[eventId]) return;
      UJIAN.processedViolationEvents[eventId] = true;
    }
    if (result.harusDiskualifikasi) {
      tampilDiskualifikasi(!!result.jawabanDireset);
      return;
    }
    if (result.duplicate && jenis !== 'pindah_tab') return;
    var warningMessage = result.message;
    if (!warningMessage && result.duplicate && jenis === 'pindah_tab') {
      var tabCount = Math.max(1, Number(result.jumlahPindahTab || UJIAN.pelanggaranPindahTab || 1));
      warningMessage = 'Peringatan pindah tab ke-' + tabCount + ' dari 3. ' + Math.max(0, 3 - tabCount) + ' kesempatan tersisa.';
    }
    if (!warningMessage) warningMessage = PESAN_PERINGATAN_LOKAL[jenis] || 'Pelanggaran keamanan terdeteksi.';
    enqueueViolationWarning_(warningMessage);
  }).catch(function(error) {
    console.warn('Pelanggaran belum terkirim:', error);
  });
}

function clipboardAllowedForEssay(element) {
  var question = currentQuestion();
  if (!question || String(question.tipe || '').toUpperCase() !== 'URAIAN') return false;
  return !!(element && element.closest && element.closest('.answer-section[data-answer-type="URAIAN"]'));
}

function isTextEditing() {
  var element = document.activeElement;
  return element && ['INPUT', 'TEXTAREA', 'SELECT'].indexOf(element.tagName) !== -1;
}

function isMobileDevice() {
  // Jangan memakai lebar viewport saja: desktop yang diperkecil dapat menyamar
  // sebagai mobile dan melewati deteksi blur/visibility.
  if (navigator.userAgentData && navigator.userAgentData.mobile === true) return true;
  if (/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '')) return true;
  var coarsePointer = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  var shortestSide = Math.min(Number(window.screen.width || 9999), Number(window.screen.height || 9999));
  return !!coarsePointer && shortestSide <= 1024;
}

/**
 * Meminta mode layar penuh.
 *
 * REVISI 3.4: mengembalikan Promise sehingga pemanggil tahu apakah browser
 * menerima permintaan. Bila ditolak (umumnya karena tidak berasal dari
 * gesture pengguna), gerbang layar penuh ditampilkan agar soal tertutup
 * sampai peserta menekan tombol "Kembali ke Layar Penuh".
 */
function requestFullscreenSafe(dariGestur) {
  var element = document.documentElement;
  if (sedangLayarPenuh_()) {
    UJIAN.fullscreenActivated = true;
    UJIAN.fullscreenRestorePending = false;
    sembunyikanGerbangLayarPenuh_();
    return Promise.resolve(true);
  }
  // Jendela induk (pembungkus) yang meminta layar penuh bila tersedia:
  // notifikasi browser jadi menampilkan domain sekolah, bukan alamat panjang
  // googleusercontent, dan hanya muncul satu kali.
  if (adaPembungkus_()) {
    try {
      window.parent.postMessage({ sumber: 'siado', aksi: 'layarPenuh' }, '*');
    } catch (error) {}
    return new Promise(function(resolve) {
      var batas = 0;
      var cek = window.setInterval(function() {
        batas += 1;
        if (GUARD.layarPenuhPembungkus) {
          window.clearInterval(cek);
          resolve(true);
          return;
        }
        if (batas >= 8) {                     // ± 800 ms
          window.clearInterval(cek);
          resolve(mintaLayarPenuhLokal_(dariGestur));
        }
      }, 100);
    });
  }
  return Promise.resolve(mintaLayarPenuhLokal_(dariGestur));
}

/** Permintaan layar penuh langsung dari halaman ujian (tanpa pembungkus). */
function mintaLayarPenuhLokal_(dariGestur) {
  var element = document.documentElement;
  var requestMethod = element.requestFullscreen || element.webkitRequestFullscreen;
  if (!requestMethod) return false; // mis. Safari iOS
  var sukses = function() {
    UJIAN.fullscreenActivated = true;
    UJIAN.fullscreenRestorePending = false;
    sembunyikanGerbangLayarPenuh_();
    // Kunci orientasi hanya diizinkan Android SETELAH masuk layar penuh.
    if (isMobileDevice()) lockPortraitIfSupported();
    return true;
  };
  var gagal = function() {
    if (UJIAN.aktif && bolehTampilGerbang_()) tampilkanGerbangLayarPenuh_();
    return false;
  };
  try {
    var request = requestMethod.call(element, { navigationUI: 'hide' });
    if (request && request.then) { request.then(sukses).catch(gagal); return true; }
    return sukses();
  } catch (error) {
    return gagal();
  }
}

function exitFullscreenSafe() {
  if (adaPembungkus_()) {
    try { window.parent.postMessage({ sumber: 'siado', aksi: 'keluarLayarPenuh' }, '*'); } catch (error) {}
  }
  GUARD.layarPenuhPembungkus = false;
  try {
    var exitMethod = document.exitFullscreen || document.webkitExitFullscreen;
    if (sedangLayarPenuh_() && exitMethod) exitMethod.call(document);
  } catch (error) {}
  UJIAN.fullscreenActivated = false;
  UJIAN.fullscreenRestorePending = false;
  sembunyikanGerbangLayarPenuh_();
}

function lockPortraitIfSupported() {
  if (!isMobileDevice() || !screen.orientation || !screen.orientation.lock) return;
  try { screen.orientation.lock('portrait').catch(function() {}); } catch (error) {}
}

/* ==================== JUDUL, DESKRIPSI, DAN PETUNJUK ==================== */

/** Judul besar di atas nama mata pelajaran pada header ujian. */
function terapkanJudulUjian_() {
  var target = document.getElementById('judulUjianHeader');
  if (target) target.textContent = UJIAN.judulUjian || '';
  var kicker = document.getElementById('briefingKicker');
  if (kicker && UJIAN.judulUjian) kicker.textContent = UJIAN.judulUjian;
}

/** Memecah petunjuk menjadi butir-butir; mendukung baris baru dan penomoran manual. */
function butirPetunjuk_(teks) {
  return String(teks || '')
    .split(/\r?\n+/)
    .map(function(baris) { return baris.replace(/^\s*(?:\d+[.)]|[-*\u2022])\s*/, '').trim(); })
    .filter(function(baris) { return baris.length > 0; });
}

/** Menyiapkan dan menampilkan halaman petunjuk sebelum peserta masuk ke soal. */
function tampilkanPetunjukUjian_(payload) {
  UJIAN.payloadTertunda = payload;
  var teks = function(id, nilai) {
    var el = document.getElementById(id);
    if (el) el.textContent = nilai || '-';
  };
  teks('briefingNama', (UJIAN.peserta && UJIAN.peserta.nama) || payload.nama);
  teks('briefingKelas', (UJIAN.peserta && UJIAN.peserta.kelas) || payload.kelas);
  teks('briefingMapel', payload.mapel);
  teks('briefingGuru', payload.guruMapel);
  teks('briefingJumlahSoal', (payload.soal || []).length + ' soal');
  var menit = Math.max(1, Math.round(Number(payload.remainingSeconds || 0) / 60));
  teks('briefingDurasi', menit + ' menit');

  var daftar = document.getElementById('briefingList');
  if (daftar) {
    var butir = butirPetunjuk_(UJIAN.petunjukUjian);
    if (!butir.length) butir = ['Kerjakan seluruh soal dengan jujur dan mandiri.'];
    daftar.innerHTML = butir.map(function(item) {
      return '<li>' + escapeHtml(item) + '</li>';
    }).join('');
  }

  var setuju = document.getElementById('briefingAgree');
  var mulai = document.getElementById('briefingStart');
  if (setuju) setuju.checked = false;
  if (mulai) mulai.disabled = true;
  terapkanJudulUjian_();
  switchScreen('briefingScreen');
}

/**
 * Melanjutkan dari halaman petunjuk ke halaman soal.
 *
 * Timer server baru dijalankan di sini (mulaiSekarang), sehingga waktu yang
 * dipakai peserta untuk membaca petunjuk tidak memotong durasi ujiannya.
 */
async function mulaiDariPetunjuk_() {
  if (!UJIAN.payloadTertunda) return;
  var tombol = document.getElementById('briefingStart');
  if (tombol) tombol.disabled = true;
  toggleLoading(true, 'Memulai ujian...');
  try {
    var payload = credentialSesi();
    payload.mulaiSekarang = true;
    var result = await apiPeserta('mulaiUjian', payload);
    if (!result.success) {
      if (result.code === 'DISKUALIFIKASI') tampilDiskualifikasi();
      else setLoginMessage(result.message || 'Ujian tidak dapat dimulai.', 'error');
      if (tombol) tombol.disabled = false;
      return;
    }
    UJIAN.payloadTertunda = null;
    terapkanPayloadUjian(result, true);
    switchScreen('examScreen');
    UJIAN.aktif = true;
    UJIAN.jeda = false;
    UJIAN.selesaiDiproses = false;
    startExamLoops();
    lockPortraitIfSupported();
  } catch (error) {
    if (tombol) tombol.disabled = false;
    tampilkanToastPeserta_('Gagal memulai ujian. Periksa koneksi lalu coba lagi.', true);
  } finally {
    toggleLoading(false);
  }
}

function switchScreen(id) {
  document.querySelectorAll('.app-screen').forEach(function(screen) { screen.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}
function toggleLoading(show, text) {

  document.getElementById('loadingOverlay').classList.toggle('show', !!show);
}
function setLoginMessage(message, type) {

  element.className = 'form-message ' + (type || 'error') + (message ? ' show' : '');
}

}
function kembaliKeLogin(pesanAkhir) {
  // Event listener browser dapat mengirim PointerEvent sebagai argumen pertama.
  // Hanya teks eksplisit yang boleh ditampilkan sebagai pesan pada form login.
  pesanAkhir = typeof pesanAkhir === 'string' ? pesanAkhir : '';
  if (UJIAN.autoExitDiskualifikasiId) clearTimeout(UJIAN.autoExitDiskualifikasiId);
  UJIAN.autoExitDiskualifikasiId = null;
  UJIAN.aktif = false;
  UJIAN.jeda = false;
  UJIAN.selesaiDiproses = false;
  GUARD.navigasiResmi = true;
  GUARD.jumlahTombolKembali = 0;
  bersihkanPenandaKeluarPaksa_();
  stopExamLoops();
  exitFullscreenSafe();
  sessionStorage.removeItem(SESSION_STORAGE_KEY);
  ['resultModal', 'warningModal', 'pauseModal', 'disqualifiedModal', 'finishModal'].forEach(hideModal);
  UJIAN.peserta = null;
  UJIAN.soal = [];
  UJIAN.versiSoal = '';
  UJIAN.jawaban = {};
  Object.keys(UJIAN.saveTimers).forEach(function(id) { clearTimeout(UJIAN.saveTimers[id]); });
  UJIAN.saveTimers = {};
  UJIAN.savePromises = {};
  UJIAN.answerVersions = {};
  UJIAN.savedVersions = {};
  UJIAN.index = 0;
  UJIAN.remaining = 0;
  ['kelasPeserta', 'usernamePeserta', 'passwordPeserta'].forEach(function(id) {
    var element = document.getElementById(id);
    if (element) element.value = '';
  });
  document.getElementById('passwordPeserta').type = 'password';
  document.getElementById('togglePassword').querySelector('i').className = 'fa-regular fa-eye';
  document.getElementById('togglePassword').setAttribute('aria-label', 'Tampilkan password');
  document.getElementById('violationCount').textContent = '0';
  UJIAN.pelanggaran = 0;
  UJIAN.pelanggaranPindahTab = 0;
  UJIAN.tabKeluarAktif = false;
  UJIAN.urutanKeluarTab = 0;
  UJIAN.warningQueue = [];
  UJIAN.warningVisible = false;
  UJIAN.fullscreenRestorePending = false;
  UJIAN.pendingViolationEvents = {};
  UJIAN.processedViolationEvents = {};
  setLoginMessage(pesanAkhir || '', pesanAkhir ? 'error' : '');
  switchScreen('loginScreen');
}
function labelTipe(type) {
  return { PG: 'PG', PGK: 'PGK', PGK_MCMA: 'PGK MCMA', ISIAN: 'ISIAN',
           URAIAN: 'URAIAN', MENJODOHKAN: 'MENJODOHKAN' }[type] || type;
}
function escapeHtml(value) {
  return String(value === undefined || value === null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function formatText(value) { return escapeHtml(value).replace(/\n/g, '<br>'); }
function formatTextInline(value) { return escapeHtml(value).replace(/\n/g, '<br>'); }
function safeMediaUrl(value) { return /^https:\/\//i.test(String(value || '')) ? String(value) : ''; }
function safeImageUrl(value) { return safeMediaUrl(value); }

/** Mengambil file id Drive dari berbagai bentuk link. */
function idDriveDariUrl_(url) {
  var teks = String(url || '');
  var pola = [
    /\/file\/d\/([a-zA-Z0-9_-]{10,})/,
    /googleusercontent\.com\/d\/([a-zA-Z0-9_-]{10,})/,
    /[?&]id=([a-zA-Z0-9_-]{10,})/,
    /\/d\/([a-zA-Z0-9_-]{10,})/
  ];
  for (var i = 0; i < pola.length; i++) {
    var cocok = teks.match(pola[i]);
    if (cocok) return cocok[1];
  }
  return '';
}

/**
 * Menyeragamkan URL gambar Drive ke endpoint /thumbnail.
 *
 * Link lama (lh3.googleusercontent.com/d/<id> atau uc?export=view) diblokir
 * Google dengan HTTP 403 ketika disematkan, sehingga gambar soal tidak tampil.
 * Soal yang sudah terlanjur tersimpan pun ikut diperbaiki di sini.
 */
function urlGambarTampil_(url, lebar) {
  var bersih = safeMediaUrl(url);
  if (!bersih) return '';
  if (!/(googleusercontent\.com|drive\.google\.com|docs\.google\.com)/i.test(bersih)) return bersih;
  var id = idDriveDariUrl_(bersih);
  if (!id) return bersih;
  return 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (lebar || 1600);
}
