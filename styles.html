<style>

.login-brand .eyebrow-sub[hidden]{display:none}.login-brand h1{font:800 24px/1.22 var(--heading);letter-spacing:-.6px;color:var(--navy);margin:0}.school-name{color:#31516f;font-size:14px;font-weight:700;margin:7px 0 0}.brand-rule{height:3px;width:42px;border-radius:99px;background:#ffb000;margin:16px auto 13px}.login-intro{color:var(--muted);font-size:14px;line-height:1.5;margin:0 auto;max-width:350px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field-group{min-width:0}.field-full{grid-column:1/-1}.field-group label{display:block;color:#40546b;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.45px;margin:0 0 7px}.field-group label i{color:var(--blue);margin-right:5px}.field-group input,.field-group textarea,.field-group select,.admin-input{width:100%;border:1.5px solid #cfdae7;background:#fff;color:var(--ink);border-radius:11px;outline:none;padding:12px 13px;font-size:14px;transition:border .2s,box-shadow .2s,background .2s}.field-group input:focus,.field-group textarea:focus,.field-group select:focus,.admin-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,111,235,.13);background:#fff}.field-group input::placeholder,.field-group textarea::placeholder{color:#9aaabd}.password-field{position:relative}.password-field input{padding-right:46px}.icon-button{border:0;background:transparent;color:#6b7e94;width:42px;height:42px;display:grid;place-items:center;position:absolute;right:1px;top:1px;border-radius:9px}.icon-button:hover{color:var(--blue);background:#f1f7ff}
.primary-button,.finish-button{border:0;border-radius:11px;background:linear-gradient(135deg,var(--blue),#1683e8);color:#fff;min-height:45px;padding:11px 17px;font-size:14px;font-weight:800;box-shadow:0 7px 17px rgba(31,111,235,.23);display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:transform .18s,box-shadow .18s,filter .18s}.primary-button:hover,.finish-button:hover{transform:translateY(-1px);box-shadow:0 10px 21px rgba(31,111,235,.30);filter:brightness(1.02)}.login-button{width:100%;margin-top:19px;min-height:49px}.form-message{display:none;margin-top:13px;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.4;font-weight:600}.form-message.show{display:block}.form-message.error{background:var(--red-soft);border:1px solid #ffd1d1;color:var(--red)}.form-message.success{background:var(--green-soft);border:1px solid #c5efd3;color:var(--green)}.login-security-note{font-size:12px;color:#62748a;display:flex;align-items:center;justify-content:center;gap:7px;margin:18px 0 13px}.login-security-note i{color:var(--green)}.login-copyright{border-top:1px solid #e7edf4;padding-top:14px;color:#7c8da2;text-align:center;font-size:11px;line-height:1.4}

#examScreen{min-height:100dvh;background:var(--page);flex-direction:column}.exam-header{position:sticky;top:0;z-index:20;background:#fff;min-height:78px;border-bottom:1px solid var(--line);padding:12px clamp(16px,3vw,38px);display:flex;align-items:center;justify-content:space-between;gap:18px}.exam-brand-block,.exam-profile,.candidate-block{display:flex;align-items:center}.exam-brand-block{gap:12px;min-width:0}.compact-mark{flex:0 0 auto;width:41px;height:41px;background:var(--blue-soft);color:var(--blue);border-radius:12px;display:grid;place-items:center;font-size:18px}.compact-mark.brand-logo{border-radius:50%;padding:0;box-shadow:0 3px 9px rgba(16,42,67,.16)}.header-overline{margin-bottom:2px}.exam-brand-block h2{font:800 16px/1.25 var(--heading);margin:0;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}.header-meta{margin:3px 0 0;font-size:11px;color:var(--muted);font-weight:600}.exam-profile{gap:10px;flex-wrap:wrap;justify-content:flex-end}.candidate-block{gap:8px;padding-right:12px;border-right:1px solid var(--line)}.candidate-icon{width:32px;height:32px;background:#f2f6fa;border-radius:50%;display:grid;place-items:center;color:#52718c}.candidate-block strong{display:block;font-size:12px;color:var(--navy);max-width:175px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.candidate-block small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.timer-box{min-width:105px;border:1.5px solid #d7e0ea;background:#fff;color:#173758;border-radius:10px;padding:9px 12px;display:flex;align-items:center;justify-content:center;gap:8px;font:800 17px/1 var(--heading);font-variant-numeric:tabular-nums;box-shadow:0 2px 6px rgba(16,42,67,.04);transition:background .3s,color .3s,border .3s}.timer-box i{font-size:15px;color:var(--blue)}.timer-box.warning{background:var(--red);border-color:var(--red);color:white;animation:timer-pulse 1.15s infinite}.timer-box.warning i{color:#fff}@keyframes timer-pulse{50%{box-shadow:0 .exam-layout{width:min(1450px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start;padding:24px clamp(16px,3vw,38px) 18px;flex:1}.question-column{min-width:0}.question-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.question-number{display:inline-flex;align-items:center;min-height:28px;background:var(--navy);color:#fff;border-radius:7px;padding:5px 10px;font:800 11px/1 var(--heading);letter-spacing:.5px}.question-type{display:inline-flex;margin-left:7px;padding:5px 9px;background:#edf4ff;color:#195fb8;border-radius:7px;font-size:11px;font-weight:800}.mark-button{border:1px solid #d5e0ed;background:#fff;color:#526c86;padding:8px 11px;border-radius:9px;font-size:12px;font-weight:800;display:inline-flex;gap:7px;align-items:center}.mark-button:hover,.mark-button.active{border-color:#eeb14a;background:#fff8e7;color:#a45f00}.mark-button.active i{font-weight:900}.question-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 7px 24px rgba(32,61,88,.06);padding:clamp(20px,3vw,34px);min-height:350px}.question-loading{min-height:250px;display:grid;place-content:center;gap:11px;text-align:center;color:#6d8197;font-size:14px}.question-loading i{font-size:25px;color:var(--blue);margin:auto}.stimulus-wrap{margin:0 0 24px;border:1px solid #dbe7f2;border-radius:13px;background:#f7fafc;padding:12px}.stimulus-wrap img{display:block;max-width:100%;width:auto;max-height:390px;border-radius:8px;margin:auto;user-select:none;-webkit-user-drag:none}.stimulus-caption{font-size:12px;text-align:center;color:#6a7f94;margin:10px 3px 0}.question-content{font-size:16px;line-height:1.8;color:#1a3452;word-break:break-word}.question-content.question-protected{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.question-content p{margin:0 0 12px}.answer-section{margin-top:27px;border-top:1px dashed #ced9e5;padding-top:20px}.answer-label{margin:0 0 12px;color:#3e5872;font-size:12px;font-weight:800;letter-spacing:.45px;text-transform:uppercase}.answer-label i{color:var(--blue);margin-right:6px}.choice-list{display:grid;gap:10px}.choice-option{position:relative;display:flex;align-items:flex-start;gap:12px;padding:13px 14px;border:1.5px solid #d6e1ec;border-radius:12px;background:#fff;transition:border .18s,background .18s,transform .18s;cursor:pointer;user-select:none}.choice-option:hover{border-color:#87b9f8;background:#f7fbff}.choice-option.checked{border-color:var(--blue);background:#edf6ff}.choice-option input{position:absolute;opacity:0;pointer-events:none}.choice-mark{width:25px;height:25px;border:1.5px solid #aabccc;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:transparent;font-size:11px;margin-top:1px}.choice-option.multi .choice-mark{border-radius:7px}.choice-option.checked .choice-mark{border-color:var(--blue);background:var(--blue);color:white}.choice-text{font-size:14px;line-height:1.55;color:#233d59}.choice-letter{font-weight:800;color:#1f5eae;margin-right:5px}.answer-input{width:100%;border:1.5px solid #cedbe8;border-radius:11px;outline:none;color:#193552;background:#fff;padding:13px 14px;font-size:15px;line-height:1.6;transition:border .2s,box-shadow .2s}.answer-input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,111,235,.12)}textarea.answer-input{min-height:155px;resize:vertical}.pgk-table{width:100%;border-collapse:separate;border-spacing:0 8px}.pgk-table th{font-size:11px;color:#60758a;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:0 9px 5px}.pgk-table td{background:#f8fbfd;border-top:1px solid #dae5ef;border-bottom:1px solid #dae5ef;padding:11px 9px;font-size:13px;line-height:1.5}.pgk-table td:first-child{border-left:1px solid #dae5ef;border-radius:10px 0 0 10px}.pgk-table td:last-child{border-right:1px solid #dae5ef;border-radius:0 10px 10px 0;width:130px}.pgk-select{width:100%;padding:8px;border:1px solid #bdcddd;border-radius:8px;b .navigation-column{position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 7px 24px rgba(32,61,88,.06);padding:18px}.navigation-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;border-bottom:1px solid #e5ecf3;padding-bottom:13px}.navigation-head h3{font:800 16px var(--heading);margin:0;color:var(--navy)}.navigation-head .panel-kicker{margin-bottom:2px}.answered-summary{font-size:10px;white-space:nowrap;color:#4170a5;background:#edf5ff;padding:5px 6px;border-radius:6px;font-weight:800}.nav-legend{display:flex;flex-wrap:wrap;gap:7px 11px;margin:13px 0;color:#60758a;font-size:10px;font-weight:700}.nav-legend span{display:flex;align-items:center;gap:4px}.legend-dot{width:9px;height:9px;border-radius:3px;background:#fff;border:1px solid #b9c9d8}.legend-dot.current{background:var(--blue);border-color:var(--blue)}.legend-dot.answered{background:var(--green);border-color:var(--green)}.question-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.nav-number{border:1.5px solid #d5e0eb;background:#fff;color:#5a7187;border-radius:8px;min-height:37px;font-size:12px;font-weight:800;transition:all .16s;position:relative}.nav-number:hover{border-color:#72aaf2;color:var(--blue)}.nav-number.answered{border-color:#4bb475;background:var(--green-soft);color:#15753a}.nav-number.current{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 9px rgba(31,111,235,.28)}.nav-tip{margin-top:17px;padding:10px;border-radius:9px;background:#f5f9fc;color:#698096;font-size:11px;line-height:1.5;display:flex;gap:7px}.nav-tip i{color:#f0a000;margin-top:2px}.exam-footer{position:sticky;bottom:0;z-index:15;border-top:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(16px,3vw,38px)}.secondary-button{border:1px solid #cddae7;background:#fff;color:#36516d;border-radius:10px;m /* MODALS */

ont-size:12px!important;margin-top:14px!important}.permanent-modal{z-index:1100}.result-card{display:flex;flex-direction:column;max-height:calc(100dvh - 40px);overflow:hidden}.result-card #resultContent{overflow-y:auto;min-height:0;margin:0 -8px;padding:0 8px;-webkit-overflow-scrolling:touch}.result-card .primary-button{flex:0 0 auto;margin-top:14px;width:100%}@keyframes modal-in{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}

#orientationLock{display:none}

@media(max-width:370px){.question-nav{grid-template-columns:repeat(6,1fr)}.timer-box{min-width:83px;font-size:14px;gap:5px}.violation-pill{display:none}.exam-brand-block h2{max-width:58vw}}
@media screen and (max-width:767px) and (orientation:landscape){#orientationLock{display:flex;position:fixed;z-index:5000;inset:0;background:#0c2a49;color:#fff;align-items:center;justify-content:center;text-align:center;padding:25px}#orientationLock i{font-size:42px;color:#91c8ff}#orientationLock h2{font:800 20px var(--heading);margin:17px 0 8px}#orientationLock p{margin:0;color:#c9e1f8;font-size:14px;line-height:1.5;max-width:290px}#examScreen{visibility:hidden}}

/* ============ REVISI v4: LOGIN TERPADU, MEDIA SOAL, HASIL ============ */
.field-hint{display:block;margin-top:6px;font-size:11px;line-height:1.45;color:#7b8fa3}
.rombel-select{width:100%;border:1.5px solid #cedbe8;border-radius:11px;background:#fff;color:#193552;padding:13px 14px;font-size:15px;outline:none;transition:border .2s,box-shadow .2s;appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23557089' stroke-width='2.5'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");background-repeat:no-repeat;background-position:right 14px center;background-size:16px;padding-right:40px}
.rombel-select:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(31,111,235,.12)}

/* Header: nama guru mapel di bawah mata pelajaran */
.header-teacher{display:flex;align-items:center;gap:6px;margin:3px 0 0;font-size:11.5px;font-weight:700;color:#1f6feb}
.header-teacher i{font-size:11px;color:#4a90e2}

/* Tombol refresh halaman ujian */
.refresh-button{display:inline-flex;align-items:center;gap:7px;border:1px solid #cddae7;background:#fff;color:#36516d;border-radius:10px;min-height:42px;padding:0 13px;font-size:12px;font-weight:800;transition:all .16s}
.refresh-button:hover{border-color:#82b4ed;background:#f5faff;color:#175ea9}
.refresh-button:disabled{opacity:.6}
.refresh-button.spinning i{animation:spin 1s linear infinite}

/* Chip status jawaban (menggantikan tombol ragu-ragu) */
.answer-state-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:800;border:1px solid transparent}
.answer-state-chip.answered{background:var(--green-soft);border-color:#a6dcbb;color:#15753a}
.answer-state-chip.empty{background:#f4f7fa;border-color:#d7e1ea;color:#6c8299}

/* Stimulus gambar dan video */
.stimulus-frame{position:relative;display:flex;justify-content:center;align-items:center;border-radius:9px;overflow:hidden;background:#eef3f8;min-height:120px}
/* Saat gambar sukses dimuat, tinggi mengikuti gambar - bukan kotak kosong raksasa. */
.stimulus-frame:not(.media-gagal){min-height:0}
.stimulus-frame.video-frame{width:100%;aspect-ratio:16/9;background:#0b1b2c}
.stimulus-video{width:100%;height:100%;border:0;display:block;border-radius:9px;background:#000}
.stimulus-wrap.video{padding:12px}
.media-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#f7fafc;color:#6b8298;font-size:13px;text-align:center;padding:18px}
/* Atribut hidden WAJIB menang atas display:flex di atas. Tanpa aturan ini overlay
   menutupi gambar stimulus walau gambarnya berhasil dimuat. */
.media-fallback[hidden]{display:none!important}
.media-fallback i{font-size:26px;color:#a7bbcd}
.media-fallback p{margin:0}
.media-fallback a{color:var(--blue);font-weight:800;font-size:12px}
.stimulus-frame.video-frame .media-fallback{background:#10233a;color:#c9dcf0}

/* Catatan salin-tempel khusus uraian */
.paste-allowed{display:inline-flex;align-items:center;gap:5px;margin-left:9px;padding:3px 8px;border-radius:99px;background:#e8f9ee;color:#15803d;font-size:10px;font-weight:800;text-transform:none;letter-spacing:0}

/* Progres navigasi */
.nav-progress{height:6px;width:100%;margin-top:12px;background:#e8eff5;border-radius:99px;overflow:hidden}
.nav-progress b{display:block;height:100%;background:linear-gradient(90deg,#1f6feb,#22c55e);border-radius:99px;transition:width .3s ease}
.nav-number.empty{border-style:dashed;border-color:#c9d6e3;color:#8ba0b4}
.finish-button.ready{animation:finish-pulse 2.4s ease-in-out infinite}
@keyframes finish-pulse{0%,100%{box-shadow:0 7px 17px rgba(21,128,61,.2)}50%{box-shadow:0 7px 24px rgba(21,128,61,.45)}}

/* Daftar soal kosong pada modal selesai */
.blank-list{display:none;margin-top:16px;text-align:left}
.blank-list-title{margin:0 0 9px;font-size:12px;font-weight:800;color:#5c7288}
.blank-numbers{display:flex;flex-wrap:wrap;gap:7px;max-height:150px;overflow:auto}
.blank-number{border:1.5px solid #f0babb;background:#fff5f5;color:#b42318;border-radius:8px;min-width:36px;min-height:34px;font-size:12px;font-weight:800}
.blank-number:hover{background:#b42318;color:#fff;border-color:#b42318}

/* Notifikasi hasil ujian */
.result-person{display:flex;flex-direction:column;gap:3px;text-align:center}
.result-person span{font-size:12px;color:#688099}
.result-banner{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin:15px 0 12px;padding:13px 15px;border-radius:13px;border:1.5px solid transparent}
.result-banner-label{font-size:10px;font-weight:800;letter-spacing:.6px;opacity:.75}
.result-banner strong{font:800 19px var(--heading);text-align:center}
.result-banner small{font-size:11px;font-weight:800;opacity:.8}
.result-banner.pass{background:#e8f9ee;border-color:#8fd6ac;color:#12652f}
.result-banner.fail{background:#fff0f0;border-color:#f0b3b3;color:#a51f1f}
.result-banner.pending{background:#fff8e6;border-color:#f0d194;color:#8a5b00}
.result-score-hero{padding:14px;border-radius:13px;background:linear-gradient(135deg,#0b2f6b,#1f6feb);color:#fff;margin-bottom:12px}
.result-score-hero span{display:block;font:800 42px/1 var(--heading)}
.result-score-hero small{display:block;margin-top:6px;font-size:10px;font-weight:800;letter-spacing:.6px;opacity:.85}
.result-stat.correct span{color:var(--green)}
.result-stat.wrong span{color:var(--red)}
.result-stat.pending span{color:#b45309}
.result-stat.pending,.result-stat.correct,.result-stat.wrong{background:#fbfdff}

/* Toast peserta */
.peserta-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;z-index:1200;display:flex;align-items:center;gap:9px;max-width:min(420px,calc(100% - 32px));padding:12px 17px;border-radius:11px;background:#15803d;color:#fff;font-size:13px;font-weight:700;box-shadow:0 12px 30px rgba(15,35,55,.28);animation:toast-up .25s ease}
.peserta-toast.error{background:#c62828}
@keyframes toast-up{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}

@media(max-width:800px){
  .refresh-button span{display:none}
  .refresh-button{padding:0 11px;min-height:38px}
  .header-teacher{font-size:10.5px}
}
@media(max-width:580px){
  .result-banner{grid-template-columns:1fr;text-align:center;gap:4px}
  .result-score-hero span{font-size:36px}
  .stimulus-frame.video-frame{aspect-ratio:16/10}
  .peserta-toast{bottom:76px;font-size:12px}
}

/* ============ REVISI v4.1: SAKELAR PERAN PADA LOGIN ============ */
.role-switch{display:flex;align-items:flex-start;gap:11px;margin:4px 0 2px;padding:12px 13px;
  border:1.5px solid #dbe6f0;border-radius:12px;background:#f8fbfe;cursor:pointer;
  transition:border-color .18s,background .18s,box-shadow .18s;user-select:none}
.role-switch:hover{border-color:#9cc6f5;background:#f2f8ff}
.role-switch input{position:absolute;opacity:0;width:0;height:0}
.role-switch-box{flex:0 0 auto;width:21px;height:21px;margin-top:1px;border-radius:6px;
  border:1.8px solid #b9cbdd;background:#fff;display:grid;place-items:center;
  transition:background .18s,border-color .18s,transform .12s}
.role-switch-box i{font-size:11px;color:#fff;opacity:0;transform:scale(.6);transition:opacity .16s,transform .16s}
.role-switch input:checked ~ .role-switch-box{background:var(--blue);border-color:var(--blue)}
.role-switch input:checked ~ .role-switch-box i{opacity:1;transform:scale(1)}
.role-switch input:focus-visible ~ .role-switch-box{box-shadow:0 0 0 3px rgba(31,111,235,.28)}
.role-switch-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.role-switch-text strong{font-size:12.5px;font-weight:800;color:#1d3a5c}
.role-switch-text small{font-size:11px;color:#7189a0;line-height:1.45}
.role-switch.is-panel{border-color:#1f6feb;background:#eef5ff;box-shadow:0 4px 12px rgba(31,111,235,.12)}
.login-card.panel-mode .brand-rule{background:#1f6feb}
.field-group.field-hidden{display:none}

.panel-open-link{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:11px 16px;
  border-radius:10px;background:var(--blue);color:#fff;font-size:13px;font-weight:800;
  text-decoration:none;box-shadow:0 6px 16px rgba(31,111,235,.28);transition:background .16s,transform .12s}
.panel-open-link:hover{background:#1a5fd0;transform:translateY(-1px)}

/* ============ REVISI v4.7: JUDUL UJIAN & HALAMAN PETUNJUK ============ */
.exam-title-big{margin:1px 0 3px;font:800 15px/1.25 var(--heading);color:#0f3b6d;
  letter-spacing:.2px;text-transform:uppercase}
.exam-title-big:empty{display:none}

.briefing-wrap{width:100%;min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;
  padding:clamp(16px,4vw,44px) clamp(14px,3vw,32px);background:
  radial-gradient(1100px 520px at 12% -8%,#e8f1ff 0%,transparent 62%),
  radial-gradient(900px 460px at 108% 8%,#eef6ff 0%,transparent 58%),#f4f8fc}
.briefing-card{width:min(940px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;
  box-shadow:0 18px 50px rgba(20,50,84,.10);padding:clamp(22px,3.4vw,40px);animation:modal-in .26s ease both}
.briefing-head{text-align:center;border-bottom:1px solid #e7eef6;padding-bottom:19px}
.briefing-mark{width:78px;height:78px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;
  background:#f2f7fd;border:1px solid #e0eaf5;overflow:hidden}
.briefing-mark img{width:60px;height:60px;object-fit:contain}
.briefing-kicker{margin:0 0 7px;font:800 15px/1.35 var(--heading);letter-spacing:1.6px;color:#4a79b3;text-transform:uppercase}
.briefing-title{margin:0;font:800 clamp(20px,2.9vw,29px)/1.24 var(--heading);color:var(--navy);letter-spacing:.2px}
.briefing-school{margin:7px 0 0;font-size:12.5px;font-weight:700;color:#6b8299;letter-spacing:.3px}

.briefing-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin:21px 0 5px}
.briefing-meta-item{background:#f7fafd;border:1px solid #e4ecf5;border-radius:12px;padding:11px 13px;min-width:0}
.briefing-meta-item span{display:block;font-size:10px;font-weight:800;letter-spacing:.5px;
  text-transform:uppercase;color:#7d93a8;margin-bottom:4px}
.briefing-meta-item strong{display:block;font-size:13.5px;color:#173c62;font-weight:800;
  overflow-wrap:anywhere;line-height:1.35}

.briefing-body{margin-top:22px}
.briefing-subtitle{margin:0 0 13px;font:800 14px var(--heading);color:var(--navy);
  display:flex;align-items:center;gap:9px}
.briefing-subtitle i{color:var(--blue)}
.briefing-list{margin:0;padding-left:0;list-style:none;counter-reset:tertib;display:grid;gap:9px}
.briefing-list li{counter-increment:tertib;position:relative;padding:12px 14px 12px 46px;
  background:#f8fbfd;border:1px solid #e5edf5;border-radius:11px;
  font-size:13.5px;line-height:1.65;color:#28455f}
.briefing-list li::before{content:counter(tertib);position:absolute;left:13px;top:11px;
  width:23px;height:23px;border-radius:7px;background:var(--blue);color:#fff;
  display:grid;place-items:center;font:800 11px var(--heading)}

.briefing-agree{display:flex;align-items:flex-start;gap:11px;margin:20px 0 0;padding:13px 15px;
  border:1.5px solid #dbe6f0;border-radius:12px;background:#f8fbfe;cursor:pointer;
  font-size:13px;line-height:1.6;color:#33506d;transition:border-color .18s,background .18s}
.briefing-agree:hover{border-color:#9cc4f3;background:#f4f9ff}
.briefing-agree input{width:19px;height:19px;flex:0 0 auto;margin-top:1px;accent-color:var(--blue);cursor:pointer}
.briefing-actions{display:flex;gap:11px;margin-top:21px}
.briefing-actions .primary-button{flex:1;min-height:47px}
.briefing-actions .secondary-button{min-height:47px;padding:9px 19px}
.briefing-actions .primary-button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

/* Deskripsi di atas gambar/video stimulus */
.stimulus-intro{margin:0 0 14px;padding:13px 15px;border-left:4px solid var(--blue);
  border-radius:0 11px 11px 0;background:#eff6ff;color:#1c4a7a;
  font-size:14px;line-height:1.68;font-weight:600}
.stimulus-intro:empty{display:none}

@media(max-width:860px){
  .briefing-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:560px){
  .briefing-meta{grid-template-columns:1fr}
  .briefing-actions{flex-direction:column-reverse}
  .briefing-actions .secondary-button{width:100%;justify-content:center}
}

/* ================================================================
 * REVISI 6: LIMA TEMA PROFESIONAL
 * Dipilih admin di panel (Pengaturan -> Tema Tampilan). Nilai variabel
 * di bawah menimpa tema bawaan navy sehingga seluruh halaman (login,
 * ruang ujian, panel) ikut berganti warna secara konsisten.
 * ================================================================ */
:root[data-theme="emerald"]{
  --navy:#0b3d2e;--ink:#123b2d;--muted:#4e7a68;--line:#cfe3d9;--surface:#ffffff;--page:#f2f8f5;
  --blue:#0e9f6e;--blue-dark:#0a7d56;--blue-soft:#e4f6ee;
  --green:#15803d;--green-soft:#e9f9ef;--amber:#b45309;--amber-soft:#fff7e8;
  --red:#c62828;--red-soft:#fff0f0;--purple:#0e9f6e;
  --shadow:0 18px 50px rgba(11,61,46,.14)
}
:root[data-theme="royal"]{
  --navy:#2b1060;--ink:#2a1654;--muted:#6d5b95;--line:#ddd4ef;--surface:#ffffff;--page:#f7f5fc;
  --blue:#6d28d9;--blue-dark:#5b21b6;--blue-soft:#f0e9fd;
  --green:#15803d;--green-soft:#e9f9ef;--amber:#b45309;--amber-soft:#fff7e8;
  --red:#c62828;--red-soft:#fff0f0;--purple:#6d28d9;
  --shadow:0 18px 50px rgba(43,16,96,.15)
}
:root[data-theme="ocean"]{
  --navy:#083344;--ink:#0c3b4d;--muted:#3f7183;--line:#c9e2ea;--surface:#ffffff;--page:#f0f8fa;
  --blue:#0d9488;--blue-dark:#0f766e;--blue-soft:#e0f5f2;
  --green:#15803d;--green-soft:#e9f9ef;--amber:#b45309;--amber-soft:#fff7e8;
  --red:#c62828;--red-soft:#fff0f0;--purple:#0d9488;
  --shadow:0 18px 50px rgba(8,51,68,.14)
}
:root[data-theme="sunset"]{
  --navy:#431407;--ink:#4a1d0e;--muted:#8a5a44;--line:#f0d9cc;--surface:#ffffff;--page:#fdf6f2;
  --blue:#ea580c;--blue-dark:#c2410c;--blue-soft:#ffedd8;
  --green:#15803d;--green-soft:#e9f9ef;--amber:#b45309;--amber-soft:#fff7e8;
  --red:#c62828;--red-soft:#fff0f0;--purple:#ea580c;
  --shadow:0 18px 50px rgba(67,20,7,.14)
}

/* ================================================================
 * KEAMANAN TAMPILAN SOAL (REVISI 3.4)
 * Gerbang layar penuh, perisai tangkapan layar, tirai privasi saat
 * peserta meninggalkan halaman, dan pemblokiran cetak halaman.
 * ================================================================ */
/* Tarik-untuk-muat-ulang (pull to refresh) Android dimatikan selama ujian:
   satu gerakan usap ke bawah bisa memuat ulang halaman dan memutus sesi. */
html.ujian-berlangsung,body.ujian-berlangsung{overscroll-behavior:none;overscroll-behavior-y:contain}
body.ujian-berlangsung{-webkit-tap-highlight-color:transparent}
body.ujian-berlangsung #examScreen,body.ujian-berlangsung #briefingScreen{
  -webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body.ujian-berlangsung #examScreen input,
body.ujian-berlangsung #examScreen textarea,
body.ujian-berlangsung #examScreen [contenteditable="true"]{
  -webkit-user-select:text;-moz-user-select:text;user-select:text}
body.ujian-berlangsung #examScreen img,
body.ujian-berlangsung #examScreen video,
body.ujian-berlangsung #examScreen iframe{-webkit-user-drag:none;user-drag:none}

/* Tirai privasi: soal disamarkan saat halaman ditinggalkan. */
body.konten-disamarkan #examScreen,
body.konten-disamarkan #briefingScreen{
  filter:blur(26px) grayscale(.55) brightness(.75);
  transition:filter .12s ease;pointer-events:none}
.privacy-veil{display:none;position:fixed;inset:0;z-index:3500;background:rgba(6,20,36,.94);
  color:#fff;align-items:center;justify-content:center;text-align:center;padding:26px}
body.konten-disamarkan .privacy-veil{display:flex}
.privacy-veil i{font-size:44px;color:#8fc4ff}
.privacy-veil h2{font:800 20px var(--heading);margin:16px 0 8px}
.privacy-veil p{margin:0 auto;max-width:340px;font-size:14px;line-height:1.55;color:#cfe3f8}

/* Perisai tangkapan layar / cetak / rekam layar. */
.screenshot-shield{display:none;position:fixed;inset:0;z-index:6000;background:#04070d;
  color:#fff;align-items:center;justify-content:center;text-align:center;padding:26px}
.screenshot-shield.show{display:flex}
.screenshot-shield i{font-size:48px;color:#ff8f8f}
.screenshot-shield h2{font:800 21px var(--heading);margin:16px 0 8px}
.screenshot-shield p{margin:0 auto 8px;max-width:360px;font-size:14px;line-height:1.55;color:#ffd9d9}
.screenshot-shield small{display:block;font-size:12px;color:#9fb3c8}

/* Gerbang layar penuh: tampil bila peserta keluar dari mode layar penuh. */
.fullscreen-gate{display:none;position:fixed;inset:0;z-index:4200;padding:20px;
  background:rgba(8,26,45,.96);backdrop-filter:blur(6px);align-items:center;justify-content:center}
.fullscreen-gate.show{display:flex}
.fullscreen-gate-card{width:min(100%,430px);background:#fff;border-radius:20px;padding:27px;
  text-align:center;box-shadow:0 22px 65px rgba(0,0,0,.4);border-top:4px solid var(--amber)}
.fullscreen-gate-card h3{font:800 20px var(--heading);color:var(--navy);margin:0 0 10px}
.fullscreen-gate-card p{font-size:14px;line-height:1.6;color:#5c7288;margin:0}
.fullscreen-gate-card .primary-button{margin-top:20px;width:100%}


/* Lapisan keamanan pada layar kecil (smartphone). */
@media (max-width:560px){
  .fullscreen-gate{padding:14px}
  .fullscreen-gate-card{padding:20px 16px;border-radius:16px}
  .fullscreen-gate-card h3{font-size:17px}
  .fullscreen-gate-card p{font-size:13px}
  .screenshot-shield,.privacy-veil{padding:20px}
  .screenshot-shield i,.privacy-veil i{font-size:36px}
  .screenshot-shield h2,.privacy-veil h2{font-size:17px}
  .screenshot-shield p,.privacy-veil p{font-size:13px}
  .screenshot-shield small{font-size:11px}
}
/* Perangkat mobile dalam mode lanskap: kartu tetap muat tanpa terpotong. */
@media (max-height:460px){
  .fullscreen-gate{align-items:flex-start;overflow-y:auto}
  .fullscreen-gate-card{margin:auto}
}

/* Mencetak halaman ujian tidak menghasilkan isi soal. */
@media print{
  html,body{background:#fff!important}
  body>*{display:none!important}
  body::before{display:block!important;content:"Mencetak atau menyimpan halaman ujian tidak diizinkan. Aktivitas ini tercatat sebagai pelanggaran.";
    font:700 16px/1.6 sans-serif;color:#000;padding:40px;text-align:center}
}
